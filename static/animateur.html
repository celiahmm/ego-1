<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EGO-1 · Animateur</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header class="entete">
    <div class="logo titre">EGO-<b>1</b></div>
    <div class="parcours" id="parcours"></div>
    <button class="icone-bouton" id="plein-ecran" type="button" aria-pressed="false" aria-label="Plein écran"
      title="Plein écran"></button>
  </header>
  <main class="ecran" id="ecran">
    <section class="gauche" id="gauche"></section>
    <section id="scene"></section>
  </main>
  <aside class="coin-salle" aria-label="Informations de la partie">
    <span class="code-salle"><small>Partie</small><b class="titre" id="code"></b></span>
    <span class="connectes"><b id="nb-joueurs">0</b> citoyen(ne)s connecté(e)s</span>
    <label class="main-levee"><input type="checkbox" id="mode-manuel"> vote à main levée</label>
  </aside>
  <div class="mini-qr cache" id="mini-qr"><img alt="QR code"><span></span></div>
  <script src="/config.js"></script>
  <script src="/robot.js"></script>
  <script src="/commun.js"></script>
  <script src="/animateur.js"></script>
</body>

</html>
